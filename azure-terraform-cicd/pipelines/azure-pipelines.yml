# Multi-stage CI/CD pipeline: Validate -> Dev (plan + deploy) -> Prod (plan + approval + deploy)
#
#   Pull request to main : Validate + Plan Dev   (shows what WOULD change, deploys nothing)
#   Push to main         : everything, Prod waits for manual approval

trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest   # has Terraform and Azure CLI preinstalled

variables:
  # --- fill these in after running scripts/bootstrap-state.sh ---
  TF_BACKEND_RG: rg-tfstate
  TF_BACKEND_SA: <your-state-storage-account>
  TF_BACKEND_CONTAINER: tfstate
  # --- name of your Azure DevOps service connection (workload identity federation) ---
  serviceConnection: sc-azure-portfolio

stages:
  - stage: Validate
    displayName: Validate & security scan
    jobs:
      - job: Validate
        steps:
          - template: templates/terraform-validate.yml

  - template: templates/environment-stages.yml
    parameters:
      environment: dev
      dependsOn: Validate
      serviceConnection: $(serviceConnection)

  - template: templates/environment-stages.yml
    parameters:
      environment: prod
      dependsOn: Deploy_dev
      serviceConnection: $(serviceConnection)
