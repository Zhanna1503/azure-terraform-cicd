<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Azure CI/CD Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 4rem auto; padding: 0 1rem; color: #1b1b1f; }
    .env { display: inline-block; padding: .2rem .6rem; border-radius: 4px; background: #0b6bcb; color: #fff; font-weight: 600; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: .4rem 1rem; }
    dt { color: #666; }
    code { font-size: .9em; }
  </style>
</head>
<body>
  <h1>Deployed by Azure Pipelines</h1>
  <p>Environment: <span class="env">__ENVIRONMENT__</span></p>
  <dl>
    <dt>Build</dt><dd><code>__BUILD__</code></dd>
    <dt>Commit</dt><dd><code>__COMMIT__</code></dd>
    <dt>Infrastructure</dt><dd>Terraform (azurerm), remote state, OIDC auth</dd>
    <dt>Pipeline</dt><dd>Validate &rarr; Plan &rarr; Deploy dev &rarr; Approval &rarr; Deploy prod</dd>
  </dl>
</body>
</html>
