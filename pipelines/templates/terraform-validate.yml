# Step template: fast checks that need no Azure access.
steps:
  - script: terraform fmt -check -recursive
    displayName: Terraform format check
    workingDirectory: infra

  - script: |
      terraform init -backend=false -input=false
      terraform validate
    displayName: Terraform validate
    workingDirectory: infra

  - script: |
      pip install --quiet checkov
      checkov -d infra --framework terraform --quiet \
        --output cli --output junitxml --output-file-path console,$(Build.ArtifactStagingDirectory)
    displayName: Security scan (Checkov)
    continueOnError: true   # report findings, don't block (switch off once findings are fixed)

  - task: PublishTestResults@2
    displayName: Publish Checkov results
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: $(Build.ArtifactStagingDirectory)/results_junitxml.xml
      testRunTitle: Checkov
      failTaskOnMissingResultsFile: false
